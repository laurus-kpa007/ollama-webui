<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama WebUI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="text-white mb-4">
                    <i class="fas fa-robot"></i> Ollama WebUI
                </h4>
                
                <!-- Mode Selection -->
                <div class="mb-3">
                    <label class="form-label text-white">모드 선택</label>
                    <select id="modeSelect" class="form-select">
                        <option value="chat">💬 채팅</option>
                        <option value="image_gen">🎨 이미지 생성</option>
                        <option value="img2img">🖼️ 이미지 변환</option>
                    </select>
                </div>

                <!-- Chat Model Selection -->
                <div id="chatModelSection" class="mb-3">
                    <label class="form-label text-white">채팅 모델</label>
                    <select id="modelSelect" class="form-select">
                        <option value="">모델을 선택하세요...</option>
                    </select>
                </div>

                <!-- ComfyUI Image Model Selection -->
                <div id="sdModelSection" class="mb-3" style="display: none;">
                    <label class="form-label text-white">이미지 생성 모델</label>
                    <select id="sdModelSelect" class="form-select">
                        <option value="">모델을 선택하세요...</option>
                    </select>
                    <div id="imageConnectionStatus" class="mt-1">
                        <span class="badge bg-secondary">연결 확인 중...</span>
                    </div>
                </div>
                
                <!-- Chat Settings -->
                <div id="chatSettings">
                    <div class="mb-3">
                        <label class="form-label text-white">온도 (Temperature)</label>
                        <input type="range" id="temperature" class="form-range" min="0" max="2" step="0.1" value="0.7">
                        <span id="tempValue" class="text-white small">0.7</span>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-white">최대 토큰 수</label>
                        <input type="number" id="maxTokens" class="form-control" placeholder="기본값 사용" min="1" max="4000">
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" id="streamMode" class="form-check-input" checked>
                            <label class="form-check-label text-white" for="streamMode">스트림 모드</label>
                        </div>
                    </div>
                </div>

                <!-- ComfyUI Image Generation Settings -->
                <div id="imageGenSettings" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label text-white">이미지 크기</label>
                        <select id="imageSize" class="form-select">
                            <option value="1024x1024" selected>1024x1024 (Qwen/SDXL 최적)</option>
                            <option value="832x1216">832x1216 (세로)</option>
                            <option value="1216x832">1216x832 (가로)</option>
                            <option value="768x768">768x768</option>
                            <option value="512x512">512x512</option>
                            <option value="512x768">512x768 (세로)</option>
                            <option value="768x512">768x512 (가로)</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-white">샘플링 스텝</label>
                        <input type="range" id="samplingSteps" class="form-range" min="10" max="100" step="5" value="50">
                        <span id="stepsValue" class="text-white small">50</span>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-white">CFG Scale</label>
                        <input type="range" id="cfgScale" class="form-range" min="1" max="15" step="0.5" value="7">
                        <span id="cfgValue" class="text-white small">7</span>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-white">네거티브 프롬프트</label>
                        <textarea id="negativePrompt" class="form-control" rows="2" placeholder="생성하지 않을 내용을 입력하세요..."></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" id="enableQwen" class="form-check-input" checked>
                            <label class="form-check-label text-white" for="enableQwen">
                                🎯 Qwen 프롬프트 개선 사용
                            </label>
                            <small class="text-white-50 d-block">AI가 프롬프트를 자동으로 개선하여 더 좋은 이미지를 생성합니다</small>
                        </div>
                    </div>
                </div>

                <!-- ComfyUI Img2Img Settings -->
                <div id="img2imgSettings" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label text-white">디노이징 강도</label>
                        <input type="range" id="denoisingStrength" class="form-range" min="0.1" max="1.0" step="0.1" value="0.8">
                        <span id="denoisingValue" class="text-white small">0.8</span>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-white">이미지 크기</label>
                        <select id="img2imgSize" class="form-select">
                            <option value="512x512">512x512</option>
                            <option value="768x768">768x768</option>
                            <option value="1024x1024">1024x1024</option>
                        </select>
                    </div>
                </div>
                
                <!-- New Chat Button -->
                <button id="newChatBtn" class="btn btn-success w-100 mb-3">
                    <i class="fas fa-plus"></i> 새 채팅
                </button>
                
                <!-- File Upload -->
                <div class="mb-3">
                    <label class="form-label text-white">이미지 업로드</label>
                    <input type="file" id="fileInput" class="form-control" accept="image/*">
                </div>
            </div>
            
            <!-- Main Chat Area -->
            <div class="col-md-9 col-lg-10 main-content d-flex flex-column">
                <!-- Chat Header -->
                <div class="chat-header p-3 border-bottom">
                    <h5 class="mb-0">
                        <span id="currentModel">모델을 선택하세요</span>
                        <span id="connectionStatus" class="badge bg-secondary ms-2">연결 확인 중...</span>
                    </h5>
                </div>
                
                <!-- Chat Messages -->
                <div id="chatMessages" class="flex-grow-1 p-3 overflow-auto">
                    <div class="welcome-message text-center text-muted">
                        <i class="fas fa-robot fa-3x mb-3"></i>
                        <h4>Ollama WebUI에 오신 것을 환영합니다!</h4>
                        <p>왼쪽에서 모델을 선택하고 대화를 시작하세요.</p>
                    </div>
                </div>
                
                <!-- Chat Input -->
                <div class="chat-input p-3 border-top">
                    <div class="input-group">
                        <textarea id="messageInput" class="form-control" placeholder="메시지를 입력하세요..." rows="2"></textarea>
                        <button id="sendBtn" class="btn btn-primary" disabled>
                            <i id="sendIcon" class="fas fa-paper-plane"></i>
                            <span id="sendText"></span>
                        </button>
                    </div>
                    <div id="uploadedImage" class="mt-2" style="display: none;">
                        <img id="previewImage" class="img-thumbnail" style="max-width: 200px; max-height: 200px;">
                        <button id="removeImage" class="btn btn-sm btn-danger ms-2">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <!-- Progress Bar -->
                    <div id="progressContainer" class="mt-2" style="display: none;">
                        <div class="progress">
                            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <small id="progressText" class="text-muted">이미지 생성 중...</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <span class="image-modal-close">&times;</span>
        <img class="image-modal-content" id="modalImage">
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Marked JS for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
