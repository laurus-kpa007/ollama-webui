<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Test - Ollama WebUI v2.0</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #0066cc; }
        h2 { color: #888; margin-top: 30px; }
        .test-section {
            background: #222;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .test-item {
            padding: 10px;
            margin: 8px 0;
            background: #2a2a2a;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .status.success { background: #28a745; color: white; }
        .status.error { background: #dc3545; color: white; }
        .status.pending { background: #ffc107; color: black; }
        button {
            padding: 10px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0052a3; }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.85em;
        }
        .summary {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🧪 Ollama WebUI v2.0 - Frontend Test</h1>
    <p>이 페이지는 프론트엔드 기능이 제대로 구현되었는지 테스트합니다.</p>

    <div class="summary" id="summary">
        <h3>테스트 요약</h3>
        <div id="summary-content">테스트를 실행하세요...</div>
    </div>

    <button onclick="runAllTests()">🚀 모든 테스트 실행</button>
    <button onclick="clearResults()">🗑️ 결과 초기화</button>

    <h2>1. JavaScript 파일 로딩</h2>
    <div class="test-section" id="js-files"></div>

    <h2>2. API 엔드포인트</h2>
    <div class="test-section" id="api-endpoints"></div>

    <h2>3. Manager 초기화</h2>
    <div class="test-section" id="managers"></div>

    <h2>4. HTML 요소</h2>
    <div class="test-section" id="html-elements"></div>

    <h2>테스트 로그</h2>
    <pre id="test-log"></pre>

    <script>
        const testLog = [];

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            testLog.push(logMessage);
            document.getElementById('test-log').textContent = testLog.join('\n');
            console.log(logMessage);
        }

        function createTestItem(name, status, details = '') {
            return `
                <div class="test-item">
                    <span>${name}</span>
                    <div>
                        ${details ? `<span style="color: #888; margin-right: 10px;">${details}</span>` : ''}
                        <span class="status ${status}">${status.toUpperCase()}</span>
                    </div>
                </div>
            `;
        }

        async function testJavaScriptFiles() {
            log('Testing JavaScript files...');
            const container = document.getElementById('js-files');
            let html = '';
            let passed = 0;
            let total = 0;

            const files = [
                'session-manager.js',
                'mcp-manager.js',
                'autogen-manager.js',
                'app.js'
            ];

            for (const file of files) {
                total++;
                try {
                    const response = await fetch(`/static/js/${file}`);
                    if (response.ok) {
                        const size = response.headers.get('content-length');
                        html += createTestItem(file, 'success', `${size} bytes`);
                        passed++;
                    } else {
                        html += createTestItem(file, 'error', `HTTP ${response.status}`);
                    }
                } catch (error) {
                    html += createTestItem(file, 'error', error.message);
                }
            }

            container.innerHTML = html;
            log(`JavaScript files: ${passed}/${total} passed`);
            return { passed, total };
        }

        async function testAPIEndpoints() {
            log('Testing API endpoints...');
            const container = document.getElementById('api-endpoints');
            let html = '';
            let passed = 0;
            let total = 0;

            const endpoints = [
                { url: '/api/sessions/', method: 'GET', name: 'List Sessions' },
                { url: '/api/autogen/agents', method: 'GET', name: 'List Agents' },
                { url: '/api/autogen/workflows', method: 'GET', name: 'List Workflows' },
                { url: '/api/mcp/status', method: 'GET', name: 'MCP Status' },
                { url: '/api/plugins/', method: 'GET', name: 'List Plugins' }
            ];

            for (const endpoint of endpoints) {
                total++;
                try {
                    const response = await fetch(endpoint.url, { method: endpoint.method });
                    if (response.ok) {
                        const data = await response.json();
                        html += createTestItem(endpoint.name, 'success', `${endpoint.method} ${endpoint.url}`);
                        passed++;
                    } else {
                        html += createTestItem(endpoint.name, 'error', `HTTP ${response.status}`);
                    }
                } catch (error) {
                    html += createTestItem(endpoint.name, 'error', error.message);
                }
            }

            container.innerHTML = html;
            log(`API endpoints: ${passed}/${total} passed`);
            return { passed, total };
        }

        function testManagers() {
            log('Testing manager initialization...');
            const container = document.getElementById('managers');
            let html = '';
            let passed = 0;
            let total = 0;

            const managers = [
                { name: 'SessionManager', check: () => typeof SessionManager !== 'undefined' },
                { name: 'MCPManager', check: () => typeof MCPManager !== 'undefined' },
                { name: 'AutogenManager', check: () => typeof AutogenManager !== 'undefined' },
                { name: 'window.sessionManager', check: () => window.sessionManager !== undefined },
                { name: 'window.mcpManager', check: () => window.mcpManager !== undefined },
                { name: 'window.autogenManager', check: () => window.autogenManager !== undefined }
            ];

            for (const manager of managers) {
                total++;
                try {
                    if (manager.check()) {
                        html += createTestItem(manager.name, 'success', 'Loaded');
                        passed++;
                    } else {
                        html += createTestItem(manager.name, 'error', 'Not found');
                    }
                } catch (error) {
                    html += createTestItem(manager.name, 'error', error.message);
                }
            }

            container.innerHTML = html;
            log(`Managers: ${passed}/${total} passed`);
            return { passed, total };
        }

        function testHTMLElements() {
            log('Testing HTML elements...');
            const container = document.getElementById('html-elements');
            let html = '';
            let passed = 0;
            let total = 0;

            const elements = [
                'session-sidebar',
                'chat-tab',
                'tools-tab',
                'agents-tab',
                'plugins-tab',
                'tools-list',
                'agents-list',
                'workflows-list',
                'mcp-connect-btn',
                'run-agents-btn'
            ];

            for (const id of elements) {
                total++;
                const element = document.getElementById(id);
                if (element) {
                    html += createTestItem(`#${id}`, 'success', element.tagName);
                    passed++;
                } else {
                    html += createTestItem(`#${id}`, 'error', 'Not found');
                }
            }

            container.innerHTML = html;
            log(`HTML elements: ${passed}/${total} passed`);
            return { passed, total };
        }

        async function runAllTests() {
            log('=== Starting all tests ===');
            testLog.length = 0; // Clear previous logs

            const results = {
                jsFiles: await testJavaScriptFiles(),
                apiEndpoints: await testAPIEndpoints(),
                managers: testManagers(),
                htmlElements: testHTMLElements()
            };

            const totalPassed = Object.values(results).reduce((sum, r) => sum + r.passed, 0);
            const totalTests = Object.values(results).reduce((sum, r) => sum + r.total, 0);
            const successRate = ((totalPassed / totalTests) * 100).toFixed(1);

            const summaryHTML = `
                <h3>📊 테스트 요약</h3>
                <p><strong>총 테스트:</strong> ${totalTests}</p>
                <p><strong>통과:</strong> ${totalPassed} ✅</p>
                <p><strong>실패:</strong> ${totalTests - totalPassed} ❌</p>
                <p><strong>성공률:</strong> ${successRate}%</p>
                <hr style="border-color: #444;">
                <p>JavaScript 파일: ${results.jsFiles.passed}/${results.jsFiles.total}</p>
                <p>API 엔드포인트: ${results.apiEndpoints.passed}/${results.apiEndpoints.total}</p>
                <p>매니저: ${results.managers.passed}/${results.managers.total}</p>
                <p>HTML 요소: ${results.htmlElements.passed}/${results.htmlElements.total}</p>
            `;

            document.getElementById('summary-content').innerHTML = summaryHTML;
            log(`=== Test complete: ${totalPassed}/${totalTests} passed (${successRate}%) ===`);

            if (totalPassed === totalTests) {
                alert('🎉 모든 테스트 통과! 프론트엔드가 정상적으로 구현되었습니다.');
            } else {
                alert(`⚠️ ${totalTests - totalPassed}개의 테스트 실패. 상세 내용을 확인하세요.`);
            }
        }

        function clearResults() {
            testLog.length = 0;
            document.getElementById('test-log').textContent = '';
            document.getElementById('js-files').innerHTML = '';
            document.getElementById('api-endpoints').innerHTML = '';
            document.getElementById('managers').innerHTML = '';
            document.getElementById('html-elements').innerHTML = '';
            document.getElementById('summary-content').textContent = '테스트를 실행하세요...';
            log('Results cleared');
        }

        // Auto-run on page load
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>
